[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "itunesremote"
version = "0.1.0"
description = "A local macOS Music library browser and rating service"
requires-python = ">=3.12"
dependencies = [
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "pyobjc-framework-iTunesLibrary==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ScriptingBridge==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-StoreKit==12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3", "pyinstaller==6.22.3"]

[project.scripts]
itunesremote = "itunesremote.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
